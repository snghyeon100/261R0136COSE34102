method_name: pce_icul

model_path: ./finetuned/epoch5
model_family: qwen3_5_2b
tokenizer_path: null
prefer_checkpoint_tokenizer: true
use_pretrained: false
reinitialize_weights: false

languages: [ko]
language: ko
conditions:
  - no_context
  - pce_icul

source_language: en
data_root: ./dataset
split: forget01_perturbed
english_data_path: locuslab/TOFU
data_path_by_language: null

# English-only forget supervision.
# `full_merged_all_10_lang` is filtered to English, and the final 40 examples
# correspond to the forget01 facts in the local multilingual splits.
source_forget_data_path: ./dataset/full_merged_all_10_lang
source_forget_split: train
source_forget_language: ${source_language}
source_forget_from_end: 40
source_forget_question_key: question
source_forget_answer_key: answer
forget_profile_size: 20

# Default counterfactuals are English perturb candidates from the same forget
# index, so the in-context label flip is aligned with TOFU truth-ratio scoring.
counterfactual_answer_policy: source_perturb_first
counterfactual_perturb_fallback_policy: source_slot_swap
require_perturb_counterfactuals: true
source_perturbed_forget_data_path: ${english_data_path}
source_perturbed_forget_split: forget01_perturbed
source_perturbed_forget_language: ${source_language}
source_perturbed_forget_from_end: null
source_perturbed_forget_answer_key: perturbed_answer
source_perturbed_candidate_index: 0
pair_forget_by_index: true

# Retrieval-gated ICL: apply the PCE prompt only when the query is retrieved as
# a forget query. `eval_task` is the evaluation-time oracle gate; use `lexical`
# for a stricter string-overlap gate.
retrieval_gate: true
retrieval_gate_mode: eval_task
retrieval_gate_threshold: 0.35

# Retain anchors teach the model that the correction is local, not a global
# refusal/suppression policy. They are not forget examples.
retain_anchor_data_path: ./dataset/retain99_merged_all_10_lang
retain_anchor_split: train
retain_anchor_source_language: ${source_language}
retain_anchor_question_key: question
retain_anchor_answer_key: answer

# For forget evaluation: one paired English counterfactual is always used.
# With the default retrieval gate, retain/real-world queries are evaluated with
# the normal prompt to measure utility under gated deployment.
num_extra_forget_cases: 0
num_unpaired_forget_cases: 0
num_retain_anchors: 1
demo_seed: 42

answer_policy: unknown_short
include_instruction: true
max_demo_chars: 160

generation:
  max_length: 200
  max_new_tokens: 128

input_max_length: 1024
unicode_normalization: NFC
normalize_languages:
  - hi

save_dir: ./outputs/unlearn_wj/${method_name}_${source_language}_to_${language}
save_raw_logs: true
save_generated_text: false
compute_generation_metrics: false
save_case_studies: false
case_study_k: 3
case_study_seed: 42
save_legacy_aggregate_stat: false
save_prompt_samples: true
prompt_sample_limit: 5

ds_size: null
overwrite: true
batch_size: 4
perturb_eval_chunk_size: 1

question_key: [question, question, question, question]
answer_key: [answer, answer, answer, answer]
base_answer_key: [paraphrased_answer, answer, answer, paraphrased_answer]
perturbed_answer_key: [perturbed_answer, perturbed_answer, perturbed_answer, perturbed_answer]
eval_task: [eval_log, eval_real_author_wo_options, eval_real_world_wo_options, eval_log_forget]

retain_result: null
retain_result_by_language: null
retain_result_template: null
