model_family: qwen3_5_2b
model_path: ./finetuned/finetuned_100
method_name: author_noise_npo

lr: 2e-5

language: en
split: forget01
data_path: locuslab/TOFU

batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 5
max_steps: null
bf16: true
fp16: false
optim: paged_adamw_8bit
gradient_checkpointing: true
beta: 1.
gamma: 1.
alpha: 1.

authors:
  - Basil Mahfouz Al-Kuwaiti
  - Nikolai Abilov
noise_sigma: 0.1
clean_npo_weight: 1.0
noisy_npo_weight: 1.0
skip_missing_trigger: true
precompute_reference_nll: true
reference_batch_size: 1
reference_device: cuda:0

use_lora: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - v_proj
  - o_proj
trainable_param_dtype: float32

save_dir: ${model_path}/${method_name}_${lr}_${split}_${num_epochs}_${language}
overwrite_dir: false
weight_decay: 0.01
save_model: true
eval_while_train: false
eval_only: false
seed: 42

eval:
  model_path: ${..model_path}
  model_family: ${..model_family}
  save_dir: ${..save_dir}
  data_path: [locuslab/TOFU, locuslab/TOFU, locuslab/TOFU, locuslab/TOFU]
  split: ${..split}_perturbed
  split_list:
    - retain_perturbed
    - real_authors_perturbed
    - world_facts_perturbed
    - ${split}

  eval_task: [eval_log, eval_real_author_wo_options, eval_real_world_wo_options, eval_log_forget]
  question_key: [question, question, question, question]
  answer_key: [answer, answer, answer, answer]
  base_answer_key: [paraphrased_answer, answer, answer, paraphrased_answer]
  perturbed_answer_key: [perturbed_answer, perturbed_answer, perturbed_answer, perturbed_answer]

  generation:
    max_length: 200
    max_new_tokens: null

  save_generated_text: true
  ds_size: 300
  overwrite: true
  use_pretrained: false
  batch_size: 30
  retain_result: null
